<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feast</title>
    <link rel="icon" href="../images/favicon-32x32.png" type="image/png">

    <link rel="stylesheet" href="../css/style.css">
    <script>
        // JavaScript om de header in te laden
        function loadHeader() {
            fetch('../header.html')
                .then(response => response.text())
                .then(data => {
                    // Verander dit naar het juiste id in de index.html
                    document.getElementById('header-container').innerHTML = data;
                });
        }

        // JavaScript om de footer in te laden
        function loadFooter() {
            fetch('../footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer-container').innerHTML = data;
                });
        }
    </script>
</head>
<body onload="loadHeader(); loadFooter();">
    
    <!-- Container waar de header geladen wordt -->
    <div id="header-container"></div>

    <section class="contact py-5">
        <div class="container">
            <h1 class="text-center mb-4">Neem Contact Op</h1>
            <form action="#" method="POST">
                <div class="form-group">
                    <label for="name">Naam</label>
                    <input type="text" class="form-control" id="name" placeholder="Voer je naam in">
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" class="form-control" id="email" placeholder="Voer je e-mail in">
                </div>
                <div class="form-group">
                    <label for="message">Bericht</label>
                    <textarea class="form-control" id="message" rows="4" placeholder="Schrijf hier je bericht"></textarea>
                </div>
                <div class="form-group text-center">
                    <button type="submit" class="btn btn-primary btn-block">Verstuur</button>
                </div>
            </form>
        </div>
    </section>
    

    <!-- Container waar de footer geladen wordt -->
    <div id="footer-container"></div>

</body>
</html>
