<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feast Footer</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet"> <!-- Verwijs naar je externe CSS bestand -->
</head>

<body>
    <!-- Footer -->
    <footer class="text-white py-4" style="background-color: #24323D;">
        <div class="container">
            <div class="row">
                <!-- Contactinformatie -->
                <div class="col-md-4">
                    <h5>Contact</h5>
                    <p><strong>Email:</strong> info@feast.nl</p>
                    <p><strong>Telefoon:</strong> +31 6 12345678</p>
                </div>
                <!-- Social Media -->
                <div class="col-md-4">
                    <h5>Volg ons</h5>
                    <div class="social-icons">
                        <a href="https://facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
                        <a href="https://twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
                        <a href="https://instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
                <!-- Extra informatie -->
                <div class="col-md-4">
                    <h5>Over Feast</h5>
                    <p>Bij Feast bieden we unieke ervaringen en arrangementen om te genieten van heerlijk eten en
                        gezelligheid. Neem contact op voor meer informatie!</p>
                </div>
            </div>
            <div class="text-center mt-3">
                <p class="mb-0">&copy; 2024 Feast. Alle rechten voorbehouden.</p>
            </div>
        </div>
    </footer>
</body>

</html>
